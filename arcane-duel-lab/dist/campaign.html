<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秘境决斗 · 秘境征途</title><link rel="stylesheet" href="campaign.css"><link rel="stylesheet" href="campaign-system.css"></head><body>
<main id="world-screen"><header><a href="lobby.html">‹ 返回大厅</a><div><small>THE SHATTERED REALMS</small><h1>秘境征途</h1></div><div><div class="solo-map-tools"><button data-system="character">角色档案</button><button data-system="bag">背包</button><button data-system="skills">技能</button><button data-system="summon">英雄召唤</button></div><label>出战英雄 <select id="hero-select"></select></label><div class="map-wallet" id="map-wallet"></div></div></header>
<div class="map-wrap"><div class="world-map" id="world-map"><img src="assets/campaign/world-map-v1.png" alt="由雪岭、熔炉、毒沼、森林及星渊建筑组成的原创秘境世界"><svg id="routes" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div id="stage-nodes"></div></div></div>
<footer><span id="progress-label"></span><p>点击建筑查看关卡 · 清除三波敌人，挑战守关首领</p><a href="enemies.html">敌人试炼 ›</a></footer><p id="save-notice" role="status"></p></main>
<dialog id="stage-detail"><button id="close-detail" class="close" aria-label="关闭">×</button><img id="detail-art" alt="关卡场景"><div class="detail-copy"><small id="detail-number"></small><h2 id="detail-title"></h2><p id="detail-tip"></p><dl><dt>守关首领</dt><dd id="detail-boss"></dd><dt>三波固定组合</dt><dd id="detail-mobs"></dd><dt>敌人生命</dt><dd id="detail-health"></dd><dt>掉落说明</dt><dd id="detail-drops"></dd></dl><div class="loot-preview" id="detail-loot"></div><p id="detail-unlock"></p><button id="enter-stage" class="gold">进入关卡 →</button></div></dialog>
<section id="battle-screen" hidden><canvas id="campaign-arena" tabindex="0" aria-label="闯关战场，AD移动，空格二段跳，鼠标攻击，FER技能，Shift冲刺"></canvas><div class="battle-top"><div class="player-card"><canvas id="portrait" width="88" height="88"></canvas><div><strong id="hero-name"></strong><div class="life-track"><span id="life-fill"></span></div><small id="life-text"></small><div class="mana-track"><span id="mana-fill"></span></div><small id="mana-text"></small><div class="player-progression" id="player-progression"></div><span id="status-effects"></span></div></div><div class="objective"><strong id="stage-title"></strong><small id="objective-text"></small><div id="encounters"></div></div><div class="solo-toolbar" id="solo-toolbar"></div><div class="hud-wallet" id="hud-wallet"></div><button id="pause">暂停 P</button></div><div id="boss-hud" hidden><strong id="boss-name"></strong><span id="boss-life"></span><div><i id="boss-fill"></i></div></div><p id="battle-notice" role="status"></p><div class="battle-bottom"><small>AD 移动 · 空格 二段跳 · 鼠标 普攻<br>F / E / R 技能 · SHIFT 冲刺<br>C 拾取 · X 结算</small><div id="hotbar"></div><button id="fullscreen">全屏 F11</button></div></section>
<section id="loading" hidden><img id="loading-art" alt="正在前往关卡"><div><small>ENTERING THE REALM</small><h2 id="loading-title">正在前往秘境</h2><p id="loading-text"></p><progress id="loading-progress" value="0" max="1"></progress><button id="retry-load" hidden>重新载入</button><button id="cancel-load">返回世界地图</button></div></section>
<dialog id="pause-dialog"><small>TAKE A BREATH</small><h2>暂停</h2><p>战斗已暂停</p><button id="resume" class="gold">继续征途</button><button id="restart">重新挑战本关</button><button id="return-map">返回世界地图</button></dialog>
<dialog id="result-dialog"><small id="result-label"></small><h2 id="result-title"></h2><p id="result-copy"></p><button id="result-primary" class="gold"></button><button id="result-map">返回世界地图</button></dialog>
<script type="module" src="src/campaign.mjs?v=20261101-campaign3"></script></body></html>
