<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1420"><title>敌人试炼 · 秘境决斗</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="skill-icons.css"><link rel="stylesheet" href="loading.css"><link rel="stylesheet" href="enemies.css"><link rel="stylesheet" href="realm-controls.css"></head>
<body><canvas id="enemy-arena" tabindex="0" aria-label="敌人交互试炼，AD移动，空格二段跳，鼠标瞄准攻击，FER技能，Shift冲刺，G机关，P暂停"></canvas>
<header class="arena-hud"><a class="return" href="lobby.html">‹ 返回大厅</a><div class="player-life"><canvas id="portrait" width="76" height="76" aria-hidden="true"></canvas><div><b id="hero-name">选择英雄并开始试炼</b><div class="life"><i id="life-fill"></i></div><span id="life-text"></span></div></div><div id="boss-hud" hidden><small>守关首领 · <span id="boss-phase"></span></small><b id="boss-name"></b><div class="life boss"><i id="boss-fill"></i></div><span id="boss-life"></span></div><button id="open-roster">选择敌人 <span>☰</span></button></header>
<aside id="roster-panel" class="roster-panel" aria-label="选择敌人与英雄"><div class="panel-title"><div><small>CREATURES OF THE REALM</small><h1>敌人试炼</h1></div><button id="close-roster" aria-label="关闭敌人选择">×</button></div><p class="panel-intro">把小怪或首领放进场景，实际交手。选择面板展开时暂停战斗。</p>
<label>你的英雄<select id="hero-select"></select></label><label>场景<select id="scene-select"><option value="moon">月光遗迹</option><option value="lava">熔岩祭坛</option><option value="garden">浮空花园</option></select></label>
<div class="roster-tabs"><button data-group="minion" aria-pressed="true">小怪 10</button><button data-group="boss" aria-pressed="false">BOSS 11</button></div><div id="enemy-list" class="enemy-list"></div>
<section class="enemy-detail"><div><small id="enemy-type"></small><h2 id="enemy-name"></h2><span id="enemy-life"></span></div><h3>被动 · <span id="enemy-passive-name"></span></h3><p id="enemy-passive-copy"></p><h3>主动招式</h3><ul id="enemy-moves"></ul></section>
<button id="start-enemy" class="gold">与当前敌人交手</button><div class="secondary-actions"><button id="add-enemy">再添加一只</button><button id="clear-enemies">清空敌人</button></div><p id="panel-notice" role="status"></p><p class="boundary">这里可单独与敌人交手；正式关卡从大厅的单机闯关进入。成长奖励后续开发。</p></aside>
<div id="status-effects" role="status"></div><div id="hotbar" class="enemy-hotbar"></div><footer class="battle-tools"><span>AD 移动 · 空格二段跳 · 鼠标普攻 · F E R 技能 · Shift 冲刺 · G 机关</span><div><button id="pause">暂停 P</button><button id="reset">重新交手 N</button><button id="fullscreen">全屏</button><button id="sound">声音 开</button></div></footer>
<div id="paused" class="pause-shade" hidden><div><small>ENEMY TRIAL</small><h2>试炼已暂停</h2><button id="resume" class="gold">继续交手</button></div></div><p id="notice" class="notice" role="status"></p><script type="module" src="src/enemy-lab.mjs?v=20261031-enemies1"></script><script type="module" src="src/realm-controls.mjs"></script></body></html>
