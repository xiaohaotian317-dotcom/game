<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>秘境联机</title><link rel="stylesheet" href="lobby.css"><link rel="stylesheet" href="realm-controls.css"><link rel="stylesheet" href="mobile-network.css"></head><body><main class="network-shell"><a class="network-back" href="lobby.html">‹ 返回大厅</a><header><small>CHOOSE YOUR CONNECTION</small><h1>携友赴战</h1><p>六位英雄 · 公平对决 · 先得三分</p></header><div class="network-choices"><section><h2>同网秘境</h2><p>连接同一个Wi-Fi，手机与新版电脑可以一起对战。</p><button id="lan-host">在此设备创建房间</button><label>好友的房主地址<input id="host-address" placeholder="例如 192.168.1.12:44174" inputmode="url" autocomplete="off"></label><button id="lan-join">连接好友的设备</button><div id="lan-addresses" role="status"></div></section><section><h2>远方之约</h2><p>使用TapTap登录，安卓玩家可以在不同网络下加入同一房间。</p><label class="privacy-choice"><input id="privacy-accepted" type="checkbox"> 我已阅读并同意<a href="mobile-privacy.html">隐私与联机说明</a></label><button id="tap-enter">TapTap异地联机</button><small id="tap-state">正在检查联机配置…</small></section></div><p id="network-notice" role="status" aria-live="polite"></p><footer>同网请使用 android1-crossplay-v2 版本。访客网络隔离可能阻止设备互通。</footer></main><script type="module" src="src/mobile-network.mjs"></script><script type="module" src="src/realm-controls.mjs"></script></body></html>
