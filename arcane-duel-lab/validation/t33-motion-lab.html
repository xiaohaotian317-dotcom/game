<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><title>人物动作重做 · 新旧对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c141e;color:#e8dbba;font:14px 'Microsoft YaHei'}header{display:flex;align-items:center;gap:9px;padding:14px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#192a35;border:1px solid #917947;padding:8px;cursor:pointer}main{display:flex;height:calc(100vh - 150px)}section{width:50%;position:relative;border:1px solid #39424b;background:radial-gradient(ellipse at 50% 60%,#29323b,#101923)}h2{position:absolute;left:20px;font-size:16px;font-weight:400}canvas{width:100%;height:100%}footer{padding:14px;line-height:1.7;color:#aebcc5}#status{font-size:12px;margin-left:auto}
</style><header><b>人物动作 · 同条件对照</b><select aria-label="预览英雄" id="hero"><option value="fire">焰术师</option><option value="nature">森灵</option><option value="frost">霜语者</option><option value="lightning">雷行者</option><option value="shadow">影刃</option><option value="star">星术师</option></select><button data-mode="idle">待机</button><button data-mode="walk">走路</button><button data-mode="jump">一段跳</button><button data-mode="double">二段跳</button><button data-mode="attack">攻击</button><button data-mode="skill">大招</button><button id="curl">二段收膝定格</button><button id="open">二段展开定格</button><button id="hit">攻击出手定格</button><button id="face">切换朝向</button><button id="ghost">影袭残影</button><button id="pause">暂停 / 继续</button><span id="status">加载原始素材</span></header>
<main><section><h2>campaign11 原动作（可回退）</h2><canvas id="old"></canvas></section><section><h2>新动作 · 头发 / 斗篷 / 重心随动</h2><canvas id="new"></canvas></section></main><footer>实际运行骨架及跳跃物理，放大检查连接；无存档读写。二段跳：收膝借力 → 职业展开 → 落地承重。<br>正式游戏保留原版回退入口，召唤立绘仍为静态。</footer>
<script type="module">
import {createWorld,step,STEP,HEROES} from '/src/simulation.mjs?v=20261030-duel12';
import {Renderer,loadAssets,ensureHeroAssets} from '/src/renderer.mjs';
import {setCharacterMotionVersion,basePose,targetPose,blendPose} from '/src/character-rig.mjs?v=20261030-duel12';
const select=document.querySelector('#hero'),status=document.querySelector('#status'),canvases=[document.querySelector('#old'),document.querySelector('#new')];
const assets=await loadAssets((n,t)=>status.textContent=`加载 ${n}/${t}`);for(const hero of Object.keys(HEROES))await ensureHeroAssets(hero,assets);
let worlds=[],renderers=canvases.map(c=>new Renderer(c,assets)),mode='idle',paused=false,last=performance.now(),acc=0,frameNo=0,face=1,paintTotal=0,paintCount=0,ghostPaintTotal=0,ghostPaintCount=0,ghostPaintMax=0;
function reset(){worlds=['legacy','v2'].map(()=>{const w=createWorld(select.value);w.targets=[];w.obstacles=[];w.platforms=[{id:'ground',active:true,x:0,y:w.floor,w:w.width,type:'stone'}];w.mechanisms=null;w.spring.enabled=false;w.player.x=w.player.prevX=600;w.player.face=face;return w;});frameNo=0;acc=0;paused=false;for(const r of renderers)r.poses[select.value]=basePose();status.textContent=HEROES[select.value].name+' · '+mode;}
function tick(){for(let j=0;j<2;j++){setCharacterMotionVersion(j?'v2':'legacy');const w=worlds[j],cycle=frameNo%190;step(w,STEP,{move:mode==='walk'?1:0,jump:['jump','double'].includes(mode)&&(cycle===1||mode==='double'&&cycle===28),attack:mode==='attack',cast:mode==='skill'?'r':mode==='ghost'&&cycle===1?'q':undefined,aim:{x:w.player.x+400*face,y:w.player.y-110}});if(w.player.x>1100)w.player.x=w.player.prevX=350;blendPose(renderers[j].poses[w.hero],targetPose(w),STEP,w.player.cast?.key==='r',w.hero==='lightning'&&w.player.cast?.key==='attack');}frameNo++;}
function paint(){const started=performance.now();for(let j=0;j<2;j++){setCharacterMotionVersion(j?'v2':'legacy');const r=renderers[j],w=worlds[j];r.resize();const c=r.ctx,W=r.canvas.width,H=r.canvas.height;c.clearRect(0,0,W,H);c.fillStyle='#131e29';c.fillRect(0,0,W,H);const scale=Math.min(W/470,H/430)*1.95,base=H*.86;c.save();c.translate(W*.5,base);c.scale(scale,scale);c.translate(-w.player.x,-w.player.y);c.strokeStyle='#53616b';c.lineWidth=.6;c.beginPath();c.moveTo(w.player.x-230,w.floor);c.lineTo(w.player.x+230,w.floor);c.stroke();for(const g of w.ghosts||[]){c.save();c.globalAlpha=.30;r.hero({...w,player:{...w.player,x:g.x,prevX:g.x,y:g.y,prevY:g.y,face:g.face,grounded:g.grounded}},1,0,{poseOverride:g.pose});c.restore();}r.hero(w,1,0);c.restore();}setCharacterMotionVersion('v2');const elapsed=performance.now()-started;paintTotal+=elapsed;if(worlds.some(w=>w.ghosts?.length)){ghostPaintTotal+=elapsed;ghostPaintCount++;ghostPaintMax=Math.max(ghostPaintMax,elapsed);}if(++paintCount%120===0){status.textContent=HEROES[select.value].name+' · '+mode+' · 双画面绘制均值 '+(paintTotal/paintCount).toFixed(1)+'ms'+(ghostPaintCount?' · 残影均值 '+(ghostPaintTotal/ghostPaintCount).toFixed(1)+'ms / 最大 '+ghostPaintMax.toFixed(1)+'ms':'');}}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;reset();};select.onchange=reset;
function freeze(n){mode='double';reset();for(let i=0;i<n;i++)tick();paused=true;status.textContent=HEROES[select.value].name+' · 二段跳 '+(n===40?'收膝':'展开');paint();}
document.querySelector('#hit').onclick=()=>{mode='attack';reset();for(let i=0;i<Math.ceil(HEROES[select.value].skills.attack.release/STEP)+3;i++)tick();paused=true;paint();status.textContent=HEROES[select.value].name+' · 攻击出手';};document.querySelector('#face').onclick=()=>{face*=-1;for(const w of worlds)w.player.face=face;paint();};document.querySelector('#ghost').onclick=()=>{select.value='shadow';mode='ghost';reset();paintTotal=0;paintCount=0;};
document.querySelector('#curl').onclick=()=>freeze(40);document.querySelector('#open').onclick=()=>freeze(60);document.querySelector('#pause').onclick=()=>paused=!paused;
reset();function frame(now){const dt=Math.max(0,Math.min(.06,(now-last)/1000));last=now;if(!paused){acc+=dt;while(acc>=STEP){tick();acc-=STEP;}}paint();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
