<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><title>双人视野隔离验收</title><style>*{box-sizing:border-box}body{margin:0;background:#06111b;color:#e6d6ae;font:12px Microsoft YaHei}canvas{width:100vw;height:100svh;display:block}nav{position:fixed;left:12px;bottom:10px;background:#07121de8;padding:8px;border:1px solid #b59c65}button{padding:7px;background:#20333c;color:#ecd5a1;border:1px solid #927a4e;margin:3px}output{display:block}</style></head><body><canvas id="view" aria-label="双人模式宽视野检查"></canvas><nav>同机隔离模拟 · 不是网络延迟验收<br><button id="right">向右走一秒</button><button id="left">向左走一秒</button><button id="turn">原地转身</button><button id="jump">二段跳</button><button id="lightning">雷拳飞行定格</button><button id="shadow">影刃飞行定格</button><output id="status">加载原图中</output></nav><script type="module">
import {Renderer,loadAssets,ensureHeroAssets} from '/src/renderer.mjs';import {createDuel,stepDuel,STEP} from '/src/duel-simulation.mjs';import {cameraView} from '/src/camera.mjs';import {requestCast} from '/src/simulation.mjs?v=20261030-duel12';
const a=await loadAssets();await Promise.all(['lightning','shadow'].map(h=>ensureHeroAssets(h,a)));const renderer=new Renderer(document.querySelector('canvas'),a);let m,walk=0,walkUntil=0,jumpAt=0,frozen=false,last=performance.now(),acc=0,clock=0;const status=document.querySelector('#status');
function reset(hero='lightning'){m=createDuel([hero,hero==='shadow'?'lightning':'shadow'],'moon');m.worlds[0].player.x=m.worlds[0].player.prevX=1100;m.worlds[1].player.x=m.worlds[1].player.prevX=1720;for(const w of m.worlds){w.mechanisms=null;w.player.y=w.player.prevY=w.floor;w.player.grounded=true;w.player.platformId='ground';w.obstacles=[];w.platforms=w.platforms.filter(p=>['ground','bridge'].includes(p.id));const bridge=w.platforms.find(p=>p.id==='bridge');if(bridge)bridge.active=false;}frozen=false;}
reset();document.querySelector('#right').onclick=()=>{walk=1;walkUntil=clock+1;frozen=false;};document.querySelector('#left').onclick=()=>{walk=-1;walkUntil=clock+1;frozen=false;};document.querySelector('#turn').onclick=()=>{m.worlds[0].player.face*=-1;frozen=true;};document.querySelector('#jump').onclick=()=>{jumpAt=clock;frozen=false;};for(const hero of ['lightning','shadow'])document.querySelector('#'+hero).onclick=()=>{reset(hero);const w=m.worlds[0];requestCast(w,'attack',1700,w.floor-60);for(let i=0;i<42;i++)stepDuel(m,STEP,[{},{}]);frozen=true;};
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;clock+=dt;if(!frozen){acc+=dt;while(acc>=STEP){const input={move:clock<walkUntil?walk:0,aim:{x:m.worlds[0].player.x+m.worlds[0].player.face*500,y:m.worlds[0].floor-60}};if(jumpAt&&clock-jumpAt<.03)input.jump=true;else if(jumpAt&&clock-jumpAt>.24&&clock-jumpAt<.27)input.jump=true;stepDuel(m,STEP,[input,{}]);acc-=STEP;}}renderer.draw(m.worlds[0],1,dt,{opponent:m.worlds[1]});const v=cameraView(m.worlds[0]);status.textContent='视宽 '+v.width.toFixed(1)+' · 镜头 '+v.x.toFixed(2)+' / '+v.y.toFixed(2)+' · 人物 '+m.worlds[0].player.x.toFixed(1)+' · 朝向 '+m.worlds[0].player.face;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
