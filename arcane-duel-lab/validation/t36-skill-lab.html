<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><title>六职业双人技能隔离验收</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1722;color:#eed7a7;font:13px Microsoft YaHei}nav{padding:12px;display:flex;gap:10px;align-items:center}button{padding:8px 20px;background:#263a43;color:#f1ddad;border:1px solid #af925a}main{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}article{background:#172634;border:1px solid #776647}h3{margin:10px 14px;font-size:15px}canvas{width:100%;height:225px;display:block}output{font-size:10px;display:block;padding:7px 14px;color:#b6c8cc}small{color:#b0bdbd}[hidden]{display:none!important}iframe{display:block;width:600px;height:650px;border:1px solid #9b8657;margin:20px auto}</style></head><body><nav>双人技能原图与实际模拟 · 隔离夹具<button id="f">F</button><button id="e">E</button><button id="r">R</button><button id="seat">切至对手释放</button><button id="narrow">窄窗搭配页</button><small id="status">加载真实素材</small></nav><main></main><iframe title="600像素技能搭配布局" hidden></iframe><script type="module">
import {Renderer,loadAssets,ensureHeroAssets} from '/src/renderer.mjs';import {loadAlternateArt,drawAlternateSkills} from '/src/alternate-skill-art.mjs';import {createDuel,stepDuel,STEP} from '/src/duel-simulation.mjs';import {requestCast,HEROES} from '/src/simulation.mjs';import {SOLO_HEROES,SOLO_NAMES} from '/src/campaign-growth-data.mjs';import {renderDuelSkillChoices,renderDuelSkillSlots} from '/src/duel-skill-ui.mjs';import {defaultDuelLoadout} from '/src/duel-skill-data.mjs';
const allNew=h=>({q:`${h}-0-1`,e:`${h}-1-1`,r:`${h}-2-1`}),assets=await loadAssets(),main=document.querySelector('main');await Promise.all(SOLO_HEROES.map(h=>ensureHeroAssets(h,assets)));await loadAlternateArt(SOLO_HEROES,assets);let seat=0,key='r',items=[];
for(const hero of SOLO_HEROES){const article=document.createElement('article');article.innerHTML='<h3>'+SOLO_NAMES[hero]+'</h3><canvas aria-label="'+SOLO_NAMES[hero]+'技能实际渲染"></canvas><output></output>';main.append(article);const canvas=article.querySelector('canvas');canvas.width=800;canvas.height=450;items.push({hero,canvas,out:article.querySelector('output'),painter:new Renderer(canvas,assets)});}
function show(){for(const item of items){const {hero,canvas,painter,out}=item,heroes=seat?['fire',hero]:[hero,'fire'],m=createDuel(heroes,'training',heroes.map(allNew));for(const [i,w]of m.worlds.entries()){w.mechanisms=null;w.obstacles=[];w.platforms=w.platforms.filter(p=>p.id==='ground');w.mirror.enabled=false;w.spring.enabled=false;Object.assign(w.player,{x:i===seat?400:510,prevX:i===seat?400:510,y:w.floor,prevY:w.floor,grounded:true,platformId:'ground',hp:400,maxHp:1000,shield:0});}const w=m.worlds[seat],rival=m.worlds[1-seat];if(hero==='shadow'&&key==='e')rival.player.x=680;requestCast(w,key,rival.player.x,w.floor-8);for(let i=0;i<(key==='q'?40:key==='e'?50:110);i++)stepDuel(m,STEP,[{},{}]);const c=canvas.getContext('2d');c.setTransform(2,0,0,2,0,0);c.fillStyle='#111f2b';c.fillRect(0,0,400,225);c.translate(175-400*.65,175-w.floor*.65);c.scale(.65,.65);c.fillStyle='#344552';c.fillRect(0,w.floor,1440,25);drawAlternateSkills(c,w,assets.alternateArt);painter.hero(w,1,.016);painter.hero(rival,1,.016);out.textContent='释放方 '+(seat+1)+' · '+w.duelSkills.loadout[key]+' · 目标生命 '+Math.round(rival.player.hp)+' · 法力/单机档案 '+(w.campaign?'异常':'未接入');}document.querySelector('#status').textContent='真实模拟定格 · '+(key==='q'?'F':key.toUpperCase())+' · 释放方 '+(seat+1);}
for(const [id,k]of [['f','q'],['e','e'],['r','r']])document.querySelector('#'+id).onclick=()=>{key=k;show();};document.querySelector('#seat').onclick=()=>{seat=1-seat;show();};
document.querySelector('#narrow').onclick=()=>{main.hidden=true;const frame=document.querySelector('iframe');frame.hidden=false;const hero='lightning',loadout=allNew(hero);frame.srcdoc='<!doctype html><html><head><base href="/"><link rel="stylesheet" href="lobby.css"><link rel="stylesheet" href="duel.css"><link rel="stylesheet" href="duel-loadout.css"><style>body{margin:0;padding:15px}#selection{padding:0}</style></head><body><section id="selection"><div class="selection-title"><h2>搭配你的技能</h2><p>雷行者 · 每行二选一</p></div><div class="duel-loadout-layout"><div class="duel-skill-choices">'+renderDuelSkillChoices(hero,loadout,HEROES[hero].skills)+'</div><aside class="duel-loadout-summary"><div class="duel-loadout-identity"><h3>雷行者</h3></div><div id="duel-picked-slots">'+renderDuelSkillSlots(hero,loadout)+'</div><p id="selection-status">选定三个技能后，双方点击准备。</p><button id="hero-ready" class="ornate-button amber">确认搭配 · 准备</button><small id="asset-status">战斗素材已就绪</small><button id="hero-prev" class="text-button">返回选择英雄</button></aside></div></section></body></html>';};show();
</script></body></html>
