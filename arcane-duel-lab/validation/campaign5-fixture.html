<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><link rel="stylesheet" href="campaign.css"><link rel="stylesheet" href="campaign-system.css"><link rel="stylesheet" href="campaign-forge.css"><link rel="stylesheet" href="campaign-pets.css"><title>灵宠出战验收 · 独立测试源</title></head><body><section style="padding:25px"><h1>灵宠出战验收 · 独立测试源</h1><p>仅在本机4207测试源放入三只已捕获灵宠，不影响桌面客户端存档，不代表自然捕获。</p><button id="review-pets">选择出战灵宠</button><button id="review-enter">保存此测试源样例，进入正式选关页面</button><pre id="review-status"></pre></section><script type="module">
import {freshSolo,loadSolo,saveSolo} from '/src/campaign-profile.mjs';import {CampaignSystemUI} from '/src/campaign-system-ui.mjs';
let p=loadSolo(localStorage);if(!p.pets.length){p=freshSolo();p.pets=[{id:'pet-11',kind:'mossdeer',form:0,capturedStage:5},{id:'pet-12',kind:'emberwing',form:0,capturedStage:7},{id:'pet-13',kind:'frostfox',form:0,capturedStage:9}];p.serial=40;}
const update=()=>{saveSolo(localStorage,p);document.querySelector('#review-status').textContent=JSON.stringify({activePetId:p.activePetId,pets:p.pets},null,2);};const ui=new CampaignSystemUI({getProfile:()=>p,getWorld:()=>null,onPause:()=>{},onClose:()=>{},onChange:update});document.querySelector('#review-pets').onclick=()=>ui.open('pet');document.querySelector('#review-enter').onclick=()=>{update();location.href='/campaign.html';};update();ui.open('pet');
</script></body></html>
