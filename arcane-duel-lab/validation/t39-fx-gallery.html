<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><title>T39 原图与真实模拟验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111c;color:#e7d2aa;font:14px 'Microsoft YaHei',sans-serif}header{padding:16px 20px;background:#111f2e;border-bottom:1px solid #66583d}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;color:#b5c6cb}nav{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}button,select{padding:9px 15px;background:#213746;border:1px solid #87734e;color:#f0d9a7}#status{color:#b8d8c8}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}article{min-width:0;background:#0d1b29;border:1px solid #53616b}h2{font-size:15px;padding:9px 12px;margin:0}canvas{display:block;width:100%;aspect-ratio:16/9}output{display:block;min-height:36px;padding:8px 12px;color:#b6c8ce;font:11px/1.45 Consolas,'Microsoft YaHei',monospace}.diagnostic canvas{background:#08111d}body.perf main{grid-template-columns:1fr;width:1280px;padding:0}body.perf article{border:0}body.perf canvas{width:1280px;height:720px}body.perf header,body.perf h2,body.perf output{display:none}[hidden]{display:none!important}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><header><h1>T39 · 六职业十八招连续原图画廊</h1><p>实际 simulation → Renderer；素材只读。地面与起跳场景使用平整测试场，保留真实重力、命中、消散与镜头。小兵事件为隔离 QA 构造，使用生产绘制路径。</p><nav><button id="ground">地面</button><button id="air">空中</button><button id="play">连续播放</button><button id="minions">小兵十一类</button><button id="sentinel">傀儡受击</button><span id="status">载入原图</span></nav></header><main></main>
<script type="module">
import {Renderer,loadAssets,ensureHeroAssets} from '/src/renderer.mjs';
import {loadAlternateArt} from '/src/alternate-skill-art.mjs';
import {createWorld,step,STEP,requestCast,damage,HEROES} from '/src/simulation.mjs';
import {applyPracticeLoadout} from '/src/practice-loadout.mjs';
import {loadSentinel} from '/src/training-sentinel.mjs';
import {loadEnemyAssets,EnemyPainter} from '/src/enemy-painter.mjs';
import {spawnEnemy} from '/src/enemy-simulation.mjs';
import {minionEffect,minionProjectile,minionPoisonPool} from '/src/minion-fx-painter.mjs';
import {phaseFrames,drawFrameBlend} from '/src/fx-animation.mjs';
const heroes=['fire','nature','frost','lightning','shadow','star'],keys=['q','e','r'],labels={q:'F',e:'E',r:'R'},assets=await loadAssets(),main=document.querySelector('main'),status=document.querySelector('#status');
await Promise.all(heroes.map(h=>ensureHeroAssets(h,assets)));await loadAlternateArt(heroes,assets);await loadSentinel(assets);await loadEnemyAssets(Array.from({length:10},(_,i)=>'M'+String(i+1).padStart(2,'0')),assets);
const allNew=h=>({q:h+'-0-1',e:h+'-1-1',r:h+'-2-1'}),items=[],special=[];let air=false,playing=false,clock=0,last=0,mode='heroes',perfHero=null,perfKey='r',perfSamples=[],perfStop=0;
function card(title,cls=''){const el=document.createElement('article');el.className=cls;el.innerHTML='<h2>'+title+'</h2><canvas></canvas><output></output>';main.append(el);return {el,canvas:el.querySelector('canvas'),out:el.querySelector('output')};}
function makeWorld(hero,key,isAir){const w=createWorld(hero,'training');applyPracticeLoadout(w,allNew(hero));w.platforms=w.platforms.filter(p=>p.id==='ground');w.mechanisms=null;w.obstacles=[];w.counterattack=false;w.moving=false;Object.assign(w.player,{x:530,prevX:530,y:w.floor-(isAir?130:0),prevY:w.floor-(isAir?130:0),vy:isAir?-360:0,grounded:!isAir,platformId:isAir?null:'ground',jumps:isAir?1:0,hp:70,maxHp:120,face:1});w.mirror.x=-1000;w.spring.x=-1000;w.targets=w.targets.slice(0,1);Object.assign(w.targets[0],{x:900,prevX:900,y:w.floor,prevY:w.floor,spawnX:900,spawnY:w.floor,platformId:'ground',maxHp:1000,hp:1000});requestCast(w,key,900,w.floor-(key==='r'||hero==='fire'&&key==='q'?5:55));return w;}
for(const hero of heroes)for(const key of keys){const o=card(HEROES[hero].name+' · '+labels[key]+' · 新技能');items.push({...o,hero,key,painter:new Renderer(o.canvas,assets),w:null});}
function reset(){clock=0;for(const i of items)i.w=makeWorld(i.hero,i.key,air);}
function active(i){return mode==='heroes'&&(!perfHero||i.hero===perfHero&&i.key===perfKey);}
function visibility(){for(const i of items)i.el.hidden=!active(i);for(const s of special)s.el.hidden=mode!==s.mode;}
function paintHeroes(dt=STEP,frameTime=null){for(const i of items){if(!active(i))continue;const start=performance.now();i.painter.draw(i.w,1,dt);const cost=performance.now()-start;i.out.textContent='t='+i.w.time.toFixed(3)+'s · '+(air?'起跳':'地面')+' · '+i.w.duelSkills.loadout[i.key]+' · 目标HP '+i.w.targets[0].hp.toFixed(1)+' · 飞行体 '+i.w.projectiles.filter(p=>p.kind==='soloBolt').length+' · 场域 '+i.w.duelSkills.fields.length;if(perfHero)perfSamples.push({cost,time:frameTime??performance.now(),worldTime:i.w.time,projectiles:i.w.projectiles.length,effects:i.w.effects.length});}}
function state(){return items.filter(active).map(i=>({hero:i.hero,key:i.key,time:i.w.time,cast:i.w.stats.casts,damage:i.w.stats.damage,projectiles:i.w.projectiles.filter(s=>s.kind==='soloBolt').map(s=>({x:s.x,y:s.y,vx:s.vx,vy:s.vy,starCore:!!s.starCore})),effects:i.w.effects.filter(e=>e.kind==='soloSkill').map(e=>({row:e.row,phase:e.phase||'cast',x:e.x,y:e.y,age:e.age,ground:!!e.ground})),fields:i.w.duelSkills.fields.map(f=>({x:f.x,y:f.y,until:f.until})),player:{x:i.w.player.x,y:i.w.player.y,grounded:i.w.player.grounded},camera:{...i.w.camera}}));}
function advance(dt){for(const i of items)if(active(i))step(i.w,dt,{});clock+=dt;}
function showHeroes(options={}){playing=false;mode='heroes';perfHero=null;air=!!options.air;document.body.classList.remove('perf');visibility();reset();const n=Math.round((options.t??.75)/STEP);for(let j=0;j<n;j++)advance(STEP);paintHeroes();status.textContent=(air?'空中起手':'地面起手')+' · 固定模拟 '+(options.t??.75).toFixed(2)+' 秒';return state();}
function baseSpecial(c,title){const w=c.canvas.width,h=c.canvas.height;c.setTransform(1,0,0,1,0,0);c.fillStyle='#08111d';c.fillRect(0,0,w,h);c.fillStyle='#263d45';c.fillRect(0,h*.78,w,h*.22);c.strokeStyle='#7c9a92';c.lineWidth=1;c.beginPath();c.moveTo(0,h*.78);c.lineTo(w,h*.78);c.stroke();}
const familyEnemy={toxicSting:'M01',spiderSilk:'M02',sonicDive:'M03',rockSmash:'M04',mantisCut:'M05',boneStrike:'M06',chainHook:'M10',serpentVenom:'M07',spiderSac:'M08',ravenCurse:'M09',poisonPool:'M07'};
for(const [family,f]of Object.entries(assets.minionFx.families)){const o=card(family+' · '+familyEnemy[family],'diagnostic');special.push({...o,mode:'minions',family,meta:f,painter:new EnemyPainter(o.canvas.getContext('2d'),assets)});}
const hook=card('M10 · 钩头与碰撞位置（十字为实际 s.x / s.y）','diagnostic');special.push({...hook,mode:'minions',family:'hook-diagnostic'});
for(const kind of ['idle','light','heavy','death']){const o=card('秘铜傀儡 · '+({idle:'待机',light:'轻击',heavy:'重击',death:'击破恢复'}[kind]));special.push({...o,mode:'sentinel',kind,painter:new Renderer(o.canvas,assets)});}
function showSpecial(which,t=.12){playing=false;perfHero=null;document.body.classList.remove('perf');mode=which;visibility();for(const s of special){if(s.mode!==which)continue;const {canvas,out}=s;canvas.width=Math.round(canvas.getBoundingClientRect().width);canvas.height=Math.round(canvas.width*9/16);if(which==='sentinel'){const w=makeWorld('fire','q',false);w.player.cast=null;w.effects=[];w.duelSkills.fields=[];w.targets[0].hp=w.targets[0].maxHp=240;w.targets[0].x=w.targets[0].prevX=w.targets[0].spawnX=780;if(s.kind!=='idle')damage(w,w.targets[0],s.kind==='light'?12:s.kind==='heavy'?38:260,{impact:false});for(let n=0;n<Math.round(t/STEP);n++)step(w,STEP,{});s.painter.draw(w);out.textContent='真实 damage() → lastHitDamage '+(w.targets[0].lastHitDamage||0)+' · t='+w.time.toFixed(3)+' · HP '+w.targets[0].hp;continue;}
const c=canvas.getContext('2d');baseSpecial(c);const scale=canvas.width/600;c.save();c.scale(scale,scale);const floor=337.5*.78;
if(s.family==='hook-diagnostic'){const point={x:370,y:floor-65},shot={enemySource:'qa-m10',enemyKind:'M10',x:point.x,y:point.y,vx:240,vy:0,age:t};minionProjectile(c,assets,{},shot);c.strokeStyle='#ff8383';c.lineWidth=1;c.beginPath();c.arc(point.x,point.y,9,0,Math.PI*2);c.moveTo(point.x-15,point.y);c.lineTo(point.x+15,point.y);c.moveTo(point.x,point.y-15);c.lineTo(point.x,point.y+15);c.stroke();c.fillStyle='#e8d2a4';c.font='13px sans-serif';c.fillText('actual hit point · radius 9',point.x-100,point.y+45);out.textContent='原图 headPivot='+JSON.stringify(assets.minionFx.families.chainHook.frames[1].headPivot)+' · s.x=370, s.y='+(floor-65).toFixed(2);}
else{const id=familyEnemy[s.family],w=makeWorld('fire','q',false);w.player.cast=null;w.targets=[];const e=spawnEnemy(w,id,{x:155,y:w.floor});e.y=e.prevY=floor-(HEROES[id]?.flying?85:0);if(['M03','M09'].includes(id))e.y=e.prevY=floor-85;e.x=e.prevX=140;w.time=w.fxTime=t;e.ai.state='idle';s.painter.unit(w,e,1);
if(s.family==='poisonPool')minionPoisonPool(c,assets,{time:t+.4},{enemyKind:id,style:'venom',x:395,y:floor,radius:80,created:0,delay:.2,life:3});
else if(['serpentVenom','spiderSac','ravenCurse','chainHook'].includes(s.family)){minionProjectile(c,assets,w,{enemySource:e.id,enemyKind:id,x:365+(t%1)*60,y:floor-80,vx:240,vy:0,age:t});minionEffect(c,assets,w,{kind:'enemyVfx',enemyKind:id,x:500,y:floor-12,age:t%.55,duration:.6,radius:60,ground:false,style:'venom'});}
else minionEffect(c,assets,w,{kind:'enemyVfx',enemyKind:id,x:370,y:s.family==='rockSmash'?floor:floor-58,age:t%.5,duration:.6,radius:85,ground:s.family==='rockSmash',melee:true,face:1});out.textContent=s.meta.file+' · '+s.meta.frames.length+' 原始相位 · 生产 minion / EnemyPainter · QA 事件 t='+t.toFixed(2);}
c.restore();}status.textContent=which==='minions'?'十一类原图与实际贴地 / 飞行绘制':'实际伤害状态驱动的傀儡轻击 / 重击 / 击破';return{mode:which,cards:special.filter(s=>s.mode===which).length};}
async function auditArt(){const a=assets.alternateArt,meta=a.refinedMeta.units,source=[];for(const hero of heroes){const m=meta[hero],im=a['refined-'+hero],c=document.createElement('canvas');c.width=im.width;c.height=im.height;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const d=ctx.getImageData(0,0,c.width,c.height).data;let zeros=0,low=0;for(let n=3;n<d.length;n+=4){if(!d[n])zeros++;if(d[n]&&d[n]<=8)low++;}const corners=m.frames.map(f=>{const [x,y,w,h]=f.rect;return[[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1]].map(([px,py])=>d[(Math.floor(py)*c.width+Math.floor(px))*4+3]);});source.push({hero,file:m.file,width:im.width,height:im.height,frames:m.frames.length,transparentPixels:zeros,lowAlpha1to8Pixels:low,cornerMaxAlpha:Math.max(...corners.flat()),rFrames:m.frames.slice(16).map(f=>({rect:f.rect,spriteRect:f.spriteRect,pivot:f.pivot,groundContactY:f.groundContactY}))});}return source;}
function startPerf(hero,key='r',count=180){mode='heroes';air=false;perfHero=hero;perfKey=key;perfSamples=[];perfStop=count;document.body.classList.add('perf');visibility();reset();clock=0;playing=true;last=0;return true;}
function performanceResult(){const costs=perfSamples.map(s=>s.cost),intervals=perfSamples.slice(1).map((s,i)=>s.time-perfSamples[i].time),quant=(a,p)=>[...a].sort((x,y)=>x-y)[Math.floor((a.length-1)*p)]||0;return{hero:perfHero,key:perfKey,canvas:[1280,720],samples:costs.length,renderMeanMs:costs.reduce((s,v)=>s+v,0)/Math.max(1,costs.length),renderP95Ms:quant(costs,.95),renderMaxMs:Math.max(0,...costs),intervalMeanMs:intervals.reduce((s,v)=>s+v,0)/Math.max(1,intervals.length),intervalP95Ms:quant(intervals,.95),intervalMaxMs:Math.max(0,...intervals),done:!playing,raw:perfSamples};}
function tick(time){requestAnimationFrame(tick);if(!playing)return;const dt=last?Math.min(.05,(time-last)/1000):1/60;last=time;for(let n=0;n<Math.max(1,Math.round(dt/STEP));n++)advance(STEP);paintHeroes(dt,time);if(perfHero&&perfSamples.length>=perfStop){playing=false;return;}if(clock>3.7)reset();}
document.querySelector('#ground').onclick=()=>showHeroes({air:false});document.querySelector('#air').onclick=()=>showHeroes({air:true});document.querySelector('#play').onclick=()=>{mode='heroes';perfHero=null;document.body.classList.remove('perf');visibility();reset();last=0;playing=true;status.textContent='十八招实际连续模拟 · 3.7 秒循环';};document.querySelector('#minions').onclick=()=>showSpecial('minions');document.querySelector('#sentinel').onclick=()=>showSpecial('sentinel');
window.__fxQA={ready:true,showHeroes,showSpecial,state,auditArt,startPerf,performanceResult,stop:()=>{playing=false;},heroNames:heroes,hookMeta:()=>assets.minionFx.families.chainHook.frames[1],familyNames:()=>Object.keys(assets.minionFx.families)};showHeroes();requestAnimationFrame(tick);
</script></body></html>
