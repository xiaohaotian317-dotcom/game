<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="/"><title>六职业动作与雷拳 · 隔离检查</title><style>body{margin:0;background:#09131e;color:#e7d8b4;font:13px 'Microsoft YaHei'}header{height:54px;display:flex;align-items:center;gap:8px;padding:0 15px}button,select{font:inherit;color:inherit;background:#132632;border:1px solid #a48d5b;padding:7px 11px;cursor:pointer}canvas{width:100%;height:calc(100vh - 100px);display:block}footer{height:44px;display:flex;align-items:center;padding:0 20px;gap:25px}#status{margin-left:auto;font-size:11px;color:#c3cfc5}</style>
<header><span>隔离动作检查</span><select id="hero" aria-label="预览英雄"><option value="fire">焰术师</option><option value="nature">森灵</option><option value="frost">霜语者</option><option value="lightning" selected>雷行者</option><option value="shadow">影刃</option><option value="star">星术师</option></select><button data-phase="rise">上升</button><button data-phase="apex">顶点</button><button data-phase="fall">下落</button><button data-phase="land">落地</button><button id="loop">跑跳循环</button><button id="attack">普攻演示</button><button id="peak">命中定格</button><button id="warning">落地预警</button><button id="pause">暂停画面</button><span id="status">加载真实运行素材</span></header>
<canvas id="arena" aria-label="实际骨架与战斗特效预览"></canvas><footer>AD移动 · 空格二段跳 · 鼠标普攻 · F/E/R技能<span>无存档写入，非自然通关</span></footer>
<script type="module">
import {createWorld,step,STEP,requestCast,HEROES} from '/src/simulation.mjs?v=20261030-duel12';
import {Renderer,loadAssets,ensureHeroAssets} from '/src/renderer.mjs';
import {basePose,targetPose,blendPose} from '/src/character-rig.mjs?v=20261030-duel12';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),select=document.querySelector('#hero');
const assets=await loadAssets((n,t)=>status.textContent=`加载 ${n}/${t}`);for(const hero of Object.keys(HEROES))await ensureHeroAssets(hero,assets);
let hero=select.value,w,renderer=new Renderer(canvas,assets),paused=false,mode='',last=performance.now(),acc=0,keys=new Set(),queued=false,aim={x:900,y:650},pointer=false;
function reset(){w=createWorld(hero,'moon');w.obstacles=[];w.platforms=[w.platforms.find(p=>p.id==='ground')];w.targets=[];w.mechanisms=null;w.spring.enabled=false;w.player.x=w.player.prevX=600;renderer.poses[hero]=basePose();mode='';paused=false;acc=0;status.textContent=HEROES[hero].name+' · 实际运行骨架';}
function physics(input){step(w,STEP,input);}
function phase(which){reset();paused=true;physics({jump:true});for(let i=0;i<200;i++){physics({});blendPose(renderer.poses[hero],targetPose(w),STEP);if(which==='rise'&&w.player.vy>-390&&w.player.vy<0||which==='apex'&&w.player.vy>=-15||which==='fall'&&w.player.vy>400||which==='land'&&w.player.land>0&&w.player.land<.13)break;}status.textContent=HEROES[hero].name+' · '+which;renderer.draw(w,1,0);}
select.onchange=()=>{hero=select.value;reset();};for(const b of document.querySelectorAll('[data-phase]'))b.onclick=()=>phase(b.dataset.phase);
document.querySelector('#loop').onclick=()=>{reset();mode='loop';};
document.querySelector('#attack').onclick=()=>{reset();mode='attack';w.targets=[{id:'dummy',x:700,y:w.floor,prevX:700,prevY:w.floor,vx:0,vy:0,w:25,h:80,hp:10000,maxHp:10000,face:-1,grounded:true,platformId:'ground',burnUntil:0,nextBurn:0,rootUntil:0,hit:0,deadUntil:0,attackAt:1e9}];aim={x:760,y:w.floor-90};};
document.querySelector('#peak').onclick=()=>{document.querySelector('#attack').click();paused=true;for(let i=0;i<31;i++){physics({attack:i===0,aim});blendPose(renderer.poses[hero],targetPose(w),STEP,false,hero==='lightning');}status.textContent=HEROES[hero].name+' · 命中定格';renderer.draw(w,1,0);};
document.querySelector('#warning').onclick=()=>{reset();mode='warning';requestCast(w,'r',790,w.floor-20);};
document.querySelector('#pause').onclick=()=>paused=!paused;
window.onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(e.code==='Space'){e.preventDefault();queued=true;}keys.add(e.code);};window.onkeyup=e=>keys.delete(e.code);
canvas.onpointermove=e=>{const r=canvas.getBoundingClientRect();aim={x:(e.clientX-r.left)/r.width*w.width,y:(e.clientY-r.top)/r.height*800};};canvas.onpointerdown=()=>pointer=true;window.onpointerup=()=>pointer=false;
reset();function frame(now){const dt=Math.max(0,Math.min(.06,(now-last)/1000));last=now;if(!paused){acc+=dt;while(acc>=STEP){const cycle=w.time%1.3,jump=mode==='loop'?(cycle<STEP||Math.abs(cycle-.2)<STEP):queued,move=mode==='loop'?(w.player.x>1000?-1:w.player.x<400?1:w.player.face):(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0);physics({jump,move,attack:mode==='attack'||pointer,aim,cast:keys.has('KeyR')?'r':keys.has('KeyE')?'e':keys.has('KeyF')?'q':undefined});queued=false;acc-=STEP;if(mode==='warning'&&w.time>.44){paused=true;break;}}}renderer.draw(w,1,paused?0:dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
