<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><link rel="stylesheet" href="campaign.css"><link rel="stylesheet" href="campaign-system.css"><link rel="stylesheet" href="campaign-forge.css"><link rel="stylesheet" href="campaign-pets.css"><title>开发验收样例 · 独立测试档</title></head><body><div style="padding:20px"><h1>开发验收样例 · 独立测试档</h1><p>此页仅本机测试服务器提供，不打入客户端；示例装备与灵石不影响桌面客户端存档；只有点击进入正式页面才写入此测试源的样例档。</p><button id="fixture-forge">打开锻造炉</button><button id="fixture-pet">打开灵宠背包</button><button id="fixture-artifact">查看收妖镜</button><button id="fixture-empty">无装备样例</button><button id="fixture-reset">重置样例</button><button id="fixture-game">进入正式页面（此测试源的隔离样例档）</button><p id="fixture-state" role="status"></p><pre id="fixture-audit"></pre></div><script type="module">
import {freshSolo,addItem} from '/src/campaign-profile.mjs';import {CampaignSystemUI} from '/src/campaign-system-ui.mjs';
let profile=JSON.parse(sessionStorage.getItem('forge-review-fixture')||'null'),paused=false;
function fresh(){const p=freshSolo();p.cleared=[1,2,3,4,5,6,7,8,9];p.mirrorEquipped=true;for(const slot of ['weapon','armor'])for(const role of ['staff','melee'])addItem(p,{type:'equipment',role,slot,quality:3,rank:0,level:0,stage:5});for(const [type,count]of [['stoneSmall',23],['stoneMedium',10],['stoneHigh',30]])addItem(p,{type,count});p.pets=[{id:'pet-200',kind:'mossdeer',form:0,capturedStage:5}];return p;}
if(!profile)profile=fresh();const audit=()=>{document.querySelector('#fixture-state').textContent=paused?'战斗状态：暂停':'战斗状态：继续';document.querySelector('#fixture-audit').textContent=JSON.stringify(profile,null,2);};
const meta=await fetch('/assets/campaign-growth/growth-ui-bounds-v1.json').then(r=>r.json());const ui=new CampaignSystemUI({getProfile:()=>profile,getWorld:()=>null,onPause:()=>{paused=true;audit();},onClose:()=>{paused=false;audit();},onChange:()=>{sessionStorage.setItem('forge-review-fixture',JSON.stringify(profile));audit();},meta});
document.querySelector('#fixture-game').onclick=()=>{localStorage.setItem('arcane-solo-growth-v1',JSON.stringify(profile));location.href='/campaign.html';};document.querySelector('#fixture-forge').onclick=()=>ui.open('forge');document.querySelector('#fixture-pet').onclick=()=>ui.open('pet');document.querySelector('#fixture-artifact').onclick=()=>ui.open('artifact');document.querySelector('#fixture-empty').onclick=()=>{profile=freshSolo();ui.forgeState=null;ui.open('forge');};document.querySelector('#fixture-reset').onclick=()=>{profile=fresh();sessionStorage.removeItem('forge-review-fixture');ui.forgeState=null;ui.open('forge');};audit();ui.open('forge');
</script></body></html>
