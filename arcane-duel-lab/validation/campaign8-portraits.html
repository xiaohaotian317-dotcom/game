<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><base href="/"><meta name="viewport" content="width=device-width"><title>敌人脸部取景 · 全量检查</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#0b1721;color:#ead7aa;font:12px "Microsoft Yahei",sans-serif}h1{font-size:21px;margin:0 0 6px}p{font-size:10px;color:#8ea5ae;margin:0 0 18px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}article{padding:12px;border:1px solid #9f8b5a66;background:#11222b;min-height:130px}article>div{display:flex;align-items:center;gap:15px}i{display:block;background-color:#203039;background-repeat:no-repeat;border:1px solid #b69d64}i.face{width:86px;height:86px;border-radius:50%;flex:none}i.small{width:40px;height:40px;border-radius:50%}i.square{width:56px;height:56px;border-radius:8px}h2{font-size:11px;margin:10px 0 0;font-weight:500}@media(max-width:700px){main{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>全部22种敌人 · 脸部特写检查</h1><p>原动作图集逐种取景；86px首领圆框、56px妖兽方框、40px血条头像。中间动作预览仍为全身。</p><main id="cards"></main><script type="module">import{ENEMIES}from'/src/enemy-roster.mjs';import{enemyPortraitStyle}from'/src/campaign-enemy-ui.mjs';document.querySelector('main').innerHTML=Object.entries(ENEMIES).map(([id,d])=>`<article data-enemy="${id}"><div>${['face','square','small'].map(c=>`<i class="${c}" style="${enemyPortraitStyle(id)}"></i>`).join('')}</div><h2>${id} · ${d.name}</h2></article>`).join('');</script></body></html>
