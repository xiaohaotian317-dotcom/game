<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><link rel="stylesheet" href="campaign.css"><link rel="stylesheet" href="campaign-system.css"><link rel="stylesheet" href="campaign-forge.css"><link rel="stylesheet" href="campaign-pets.css"><title>campaign6隔离验收</title></head><body><section style="padding:25px"><h1>campaign6隔离验收</h1><p>独立4208测试源：样例灵宠、经验、金币与法宝只供验收，不代表自然获得，不写入桌面存档。</p><button id="review-pets">查看灵宠和进化</button><button id="review-artifacts">查看法宝与升级</button><button id="review-game">保存样例进入正式选关</button><pre id="review-status"></pre></section><script type="module">
import {freshSolo,loadSolo,saveSolo,addItem} from '/src/campaign-profile.mjs';import {CampaignSystemUI} from '/src/campaign-system-ui.mjs';import {equipArtifact} from '/src/campaign-artifacts.mjs';
let p=loadSolo(localStorage);if(!p.pets.length){p=freshSolo();p.coins=2000;p.cleared=[1,2,3,4,5,6,7,8,9];p.heroes.fire.exp=1800;p.pets=[{id:'pet-11',kind:'mossdeer',form:0,exp:1490,traits:{hp:1.04,mp:.96,attack:1.02},capturedStage:5},{id:'pet-12',kind:'emberwing',form:1,exp:290,traits:{hp:.94,mp:1.06,attack:1},capturedStage:7},{id:'pet-13',kind:'frostfox',form:2,exp:1490,traits:{hp:1.02,mp:.98,attack:1.08},capturedStage:9}];p.activePetId='pet-11';p.serial=40;addItem(p,{type:'mirror'});addItem(p,{type:'skySword'});equipArtifact(p,'sword');}
const update=()=>{saveSolo(localStorage,p);document.querySelector('#review-status').textContent=JSON.stringify({coins:p.coins,equippedArtifact:p.equippedArtifact,artifacts:p.artifacts,activePetId:p.activePetId,pets:p.pets},null,2);};const ui=new CampaignSystemUI({getProfile:()=>p,getWorld:()=>null,onPause:()=>{},onClose:()=>{},onChange:update});document.querySelector('#review-pets').onclick=()=>ui.open('pet');document.querySelector('#review-artifacts').onclick=()=>ui.open('artifact');document.querySelector('#review-game').onclick=()=>{update();location.href='/campaign.html';};update();
</script></body></html>
