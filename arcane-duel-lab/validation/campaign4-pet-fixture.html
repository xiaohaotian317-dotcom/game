<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><link rel="stylesheet" href="campaign.css"><link rel="stylesheet" href="campaign-system.css"><link rel="stylesheet" href="campaign-forge.css"><link rel="stylesheet" href="campaign-pets.css"><title>灵宠实战开发样例 · 非自然通关</title></head><body><canvas id="pet-canvas" tabindex="0" style="position:fixed;inset:0;width:100%;height:100%"></canvas><div style="position:fixed;top:10px;left:10px;z-index:3;background:#071723e8;padding:12px;border:1px solid #ab945f;font-size:12px;max-width:560px"><strong>开发样例：复现首领死亡后的阶段，不写玩家档</strong><p>固定成功随机源供流程验收；正常捕捉有失败概率。</p><button data-fixture-stage="5">第5关灵鹿</button><button data-fixture-stage="7">第7关狮鹫</button><button data-fixture-stage="9">第9关灵狐</button><button id="run">继续模拟</button><button id="lower">低生命样例</button><button id="mirror">V 收妖镜</button><button id="pets">查看捕获背包</button><p id="qa-state">正在载入</p></div><script type="module">
import {createCampaign,beginEncounter,stepCampaign,fitCampaignCamera} from '/src/campaign-simulation.mjs';import {freshSolo} from '/src/campaign-profile.mjs';import {loadAssets,Renderer} from '/src/renderer.mjs?v=20261031-enemies1';import {CampaignPainter,loadCampaignArt} from '/src/campaign-painter.mjs';import {loadEnemyAssets} from '/src/enemy-painter.mjs';import {damage,STEP} from '/src/simulation.mjs?v=20261031-enemies1';import {STAGE_BY_ID} from '/src/campaign-data.mjs';import {CampaignSystemUI} from '/src/campaign-system-ui.mjs';import {captureChance} from '/src/campaign-pet-data.mjs';
const canvas=document.querySelector('#pet-canvas'),status=document.querySelector('#qa-state');let w,renderer,assets,paused=true,pendingCapture=false,profile,last=performance.now();const keys=new Set();
const ui=new CampaignSystemUI({getProfile:()=>profile,getWorld:()=>w,onPause:()=>paused=true,onClose:()=>paused=true,onChange:()=>{}});
async function setup(id){paused=true;status.textContent='正在载入'+id;profile=freshSolo();profile.cleared=[1,2,3,4,5,6,7,8,9];profile.mirrorEquipped=true;if(!assets)assets=await loadAssets(()=>{},{scenes:false});const s=STAGE_BY_ID[id];await loadEnemyAssets([s.boss],assets);assets.campaignPainter=new CampaignPainter(await loadCampaignArt(s));w=createCampaign('fire',id,{profile,petDungeon:true,seed:3,random:()=>0});w.enemyArt=assets.enemyArt;w.campaign.encounter=3;w.camera.x=8500;fitCampaignCamera(w,innerWidth,innerHeight);beginEncounter(w);const boss=w.targets.find(t=>t.id===w.campaign.bossId);damage(w,boss,1e6);stepCampaign(w,STEP);w.targets=w.targets.filter(t=>t.petKind);const pet=w.targets[0];w.player.x=w.player.prevX=pet.x-200;w.player.y=w.player.prevY=w.floor;renderer=new Renderer(canvas,assets);status.textContent='样例已暂停 · 点击继续模拟';}
document.querySelectorAll('[data-fixture-stage]').forEach(b=>b.onclick=()=>setup(Number(b.dataset.fixtureStage)));document.querySelector('#run').onclick=()=>{paused=!paused;};document.querySelector('#lower').onclick=()=>{const pet=w?.targets.find(t=>t.petKind);if(pet)pet.hp=Math.round(pet.maxHp*.1);};document.querySelector('#mirror').onclick=()=>pendingCapture=true;document.querySelector('#pets').onclick=()=>ui.open('pet');window.addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='KeyV')pendingCapture=true;});window.addEventListener('keyup',e=>keys.delete(e.code));canvas.onpointerdown=()=>{const target=w?.targets.find(t=>t.petKind&&t.hp>0);if(target)stepCampaign(w,STEP,{attack:true,aim:{x:target.x,y:target.y-25}});};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(w&&renderer){if(!paused)for(let t=0;t<dt;t+=STEP){stepCampaign(w,STEP,{move:(keys.has('KeyD')?1:0)-(keys.has('KeyA')?1:0),capture:pendingCapture});pendingCapture=false;}renderer.draw(w,1,paused?0:dt);const pet=w.targets.find(t=>t.petKind);status.textContent=`${paused?'暂停':'运行'} · ${w.campaign.state} · 玩家HP ${Math.ceil(w.player.hp)} · 灵宠HP ${pet?Math.ceil(pet.hp):0} · 概率${pet?Math.round(captureChance(pet.hp,pet.maxHp)*100):0}% · 捕获${profile.pets.length}只 · ${w.campaign.notice}`;}requestAnimationFrame(frame);}requestAnimationFrame(frame);setup(5);
</script></body></html>
